name: Compilar APK Nativo Autonomo (GFP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Sincronizar gfp-vault/index.html para dentro do APK
        run: |
          if [ -f "gfp-vault/index.html" ]; then
            cp "gfp-vault/index.html" "android-apk/app/src/main/assets/index.html"
          fi

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Compilar GFP-Nativo.apk
        working-directory: android-apk
        run: |
          gradle assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../GFP-Nativo.apk

      - name: Disponibilizar GFP-Nativo.apk para Download
        uses: actions/upload-artifact@v4
        with:
          name: GFP-Nativo-APK
          path: GFP-Nativo.apk
          if-no-files-found: error
