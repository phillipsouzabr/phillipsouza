<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Redirecionando...</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZ3QL2RJGM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // transport_type: 'beacon' garante o envio do hit mesmo com a página
    // saindo do ar quase instantaneamente, através do redirect abaixo.
    gtag('config', 'G-ZZ3QL2RJGM', { 'transport_type': 'beacon' });
  </script>

  <!-- Fallback para navegadores com JavaScript desativado -->
  <noscript>
    <meta http-equiv="refresh" content="0;url=https://www.youtube.com/playlist?list=PLnfTpbnNywejSDZGmxlz0kWFtVdB8rDZU" />
  </noscript>

  <script>
    // Pequeno atraso (300ms, imperceptível) só para dar tempo do hit
    // do GA4 disparar antes de sair da página.
    setTimeout(function() {
      window.location.replace("https://www.youtube.com/playlist?list=PLnfTpbnNywejSDZGmxlz0kWFtVdB8rDZU");
    }, 300);
  </script>
</head>
<body></body>
</html>
