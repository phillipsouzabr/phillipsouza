<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0F19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="application-name" content="Gestor Financeiro">
  <meta name="apple-mobile-web-app-title" content="Gestor Financeiro">
  <title>Gestor Financeiro</title>
  <link rel="manifest" href="/gfp/manifest.json">
  <link id="favIconPng" rel="icon" type="image/png" sizes="512x512" href="/gfp/icon.png">
  <link id="appleIconPng" rel="apple-touch-icon" sizes="512x512" href="/gfp/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0B0F19;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- COLE SUA URL DO GOOGLE APPS SCRIPT ABAIXO -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwhcGqu8MCRZSYiVppqlAEV6azjPsx6XfjKAIfQxV4S9cn6yBo04mlbTSKh_r6ntpPdpw/exec" 
    allow="camera; microphone; clipboard-read; clipboard-write">
  </iframe>

  <script>
    // Força a barra de endereço a ter a barra "/" final (/gfp/) para o Android achar o manifest.json
    if (window.location.pathname === '/gfp') {
      window.location.replace('/gfp/' + window.location.search);
    }

    // Registra o Service Worker na pasta /gfp/
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/gfp/sw.js', { scope: '/gfp/' }).catch(() => {});
      });
    }

    // Gerador automático do icon.png (512x512) com o logo "PS"
    (function generatePSIcon() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');

      // Fundo Dark #0B0F19
      ctx.fillStyle = '#0B0F19';
      ctx.beginPath();
      ctx.roundRect(0, 0, 512, 512, 112);
      ctx.fill();

      // Gradiente Azul -> Roxo
      const grad = ctx.createLinearGradient(36, 36, 476, 476);
      grad.addColorStop(0, '#2563EB');
      grad.addColorStop(1, '#7C3AED');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(36, 36, 440, 440, 92);
      ctx.fill();

      // Texto "PS"
      ctx.fillStyle = '#FFFFFF';
      ctx.font = '900 215px Inter, Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('PS', 256, 268);

      // Se você abrir phillipsouza.com/gfp/?icone no PC, ele baixa o arquivo icon.png pronto!
      if (window.location.search.includes('icone')) {
        const a = document.createElement('a');
        a.href = c.toDataURL('image/png');
        a.download = 'icon.png';
        a.click();
      }
    })();
  </script>
</body>
</html>
