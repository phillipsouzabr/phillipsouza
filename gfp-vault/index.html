<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- Impede que o Google ou buscadores indexem essa página -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B0F19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GFP PS">
  <title>GFP — Inteligência Financeira</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0B0F19;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <!-- SUBSTITUA ABAIXO PELA SUA URL DO GOOGLE APPS SCRIPT (terminada em /exec) -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbwhcGqu8MCRZSYiVppqlAEV6azjPsx6XfjKAIfQxV4S9cn6yBo04mlbTSKh_r6ntpPdpw/exec" 
    allow="camera; microphone; clipboard-read; clipboard-write">
  </iframe>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
